spring:
  datasource:
    url: jdbc:h2:mem:testcoldchain;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true

# 集成测试直调 AlertScanService 模拟定时扫描，关闭后台定时器避免并发干扰
coldchain:
  alert-scan:
    enabled: false
  # V6 升级扫描同样关闭：测试用注入业务时钟直调 scanEscalations(now)，避免墙钟定时器提前升级
  escalation:
    scan:
      enabled: false

